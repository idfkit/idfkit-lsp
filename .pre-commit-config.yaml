repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(server|tools|tests)/
      - id: ruff-format
        files: ^(server|tools|tests)/

  - repo: https://github.com/RobertCraiworthy/pyright-python
    rev: v1.1.393
    hooks:
      - id: pyright
        files: ^(server/src|tools|tests/protocol)/
        # Read the project's own pyright configuration rather than a second one written here:
        # `extraPaths` and the resolved environment are what let tools/ and tests/protocol/
        # resolve idfkit_lsp and the libraries they import.
        args: ["--project", "server"]
        additional_dependencies:
          # Exact levels, as Principle III requires of every pin this repository states.
          - pygls==2.1.1
          - lsprotocol==2025.0.0
          - jsonschema==4.26.0

  - repo: local
    hooks:
      - id: check-declaration
        name: capabilities.json agrees with the manifest and the servers
        entry: make check-declaration
        language: system
        pass_filenames: false
        files: ^(capabilities\.json|package\.json|README\.md|server/src/|model-server/src/)
      - id: check-levels
        name: levels.json agrees with every file that declares a level
        entry: make check-levels
        language: system
        pass_filenames: false
        files: ^(levels\.json|server/pyproject\.toml|server/uv\.lock|model-server/package\.json|client/package\.json)
      - id: check-knowledge
        name: no schema table, grammar pattern, or model-text offset arithmetic
        entry: make check-knowledge
        language: system
        pass_filenames: false
        files: ^(server/src/|model-server/src/|client/src/)

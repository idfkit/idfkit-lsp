name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This repository's entry in the consumer register (governance/consumers.toml in
  # idfkit-conformance, id `idfkit-lsp`) must still describe it: both Resolutions, the level of each
  # declared where the register says, and the declarations of one release agreeing across
  # server/pyproject.toml, model-server/package.json and levels.json. The tag is stated on `uses:`
  # and again as the input, and the called workflow refuses the run unless the two match. It says
  # nothing about whether a level is current; levels.json and the sweep say that.
  consumer-register:
    name: Consumer register
    uses: idfkit/idfkit-conformance/.github/workflows/check-consumer.yml@governance-2026.18
    with:
      governance_level: governance-2026.18

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version is pinned, and pinned to the one `server/pyproject.toml` declares. Without it
      # the action resolves the floor to whatever is newest that day, so a ruff release adding a
      # rule inside a selected category turns this red with no change to this repository. Principle
      # III asks for an exact level on everything resolved here, and a linter that decides whether
      # a change may land is resolved here.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.6"
          src: server/src server/tests tools tests

      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.6"
          src: server/src server/tests tools tests
          args: format --check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - run: uv sync --extra dev
        working-directory: server

      - run: uv run pyright src ../tools ../tests/protocol
        working-directory: server

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci
        working-directory: model-server

      - run: npm run typecheck
        working-directory: model-server

  declaration:
    name: Capability declaration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - run: make check-declaration

  levels:
    name: Declared levels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - run: make check-levels

  knowledge:
    name: No knowledge in the extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - run: make check-knowledge

  test:
    name: Source server (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - run: uv python install ${{ matrix.python-version }}

      - run: uv sync --extra dev --python ${{ matrix.python-version }}
        working-directory: server

      # The repository checks have tests of their own, and nothing else in CI runs them.
      - run: uv run pytest tests ../tools/tests -v
        working-directory: server

  test-model:
    name: Model server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci
        working-directory: model-server

      - run: npm test
        working-directory: model-server

  protocol:
    name: Protocol suite (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: uv python install ${{ matrix.python-version }}

      - run: uv sync --extra dev --python ${{ matrix.python-version }}
        working-directory: server

      # The protocol suite drives the model server too, so its bundle has to exist.
      - run: npm ci
        working-directory: model-server

      - run: npm run build
        working-directory: model-server

      - run: uv run --project server python -m pytest tests/protocol -v -rs

  # The model server as npm publishes it: packed, installed from the tarball into a directory that
  # has never seen this checkout, and driven by the same protocol suite. The suite above runs the
  # bundle in place, which cannot catch a file the tarball forgot or a command that does not start.
  packed:
    name: Packed model server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: uv sync --extra dev
        working-directory: server

      - run: npm ci
        working-directory: model-server

      # `npm pack` runs `prepack`, which builds the bundle and copies the declaration and the
      # licence in, and `postpack`, which takes both copies out of the checkout again.
      # `--pack-destination` does not create the directory it names.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
        working-directory: model-server

      - name: Install from the tarball
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/pack/*.tgz

      - name: The tarball carries what the server needs, and its command starts
        run: >-
          uv run --project server python -m tools.check_package
          --tarball "$(ls "$RUNNER_TEMP"/pack/*.tgz)"
          --installed "$RUNNER_TEMP/consumer"

      # Without the bundle in the checkout, so nothing can quietly fall back to it.
      - name: Protocol suite against the installed package
        run: |
          rm -rf model-server/dist
          uv run --project server python -m pytest tests/protocol -v -rs
        env:
          MODEL_SERVER_PACKAGE: ${{ runner.temp }}/consumer/node_modules/@idfkit/language-server

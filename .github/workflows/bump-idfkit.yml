name: Bump idfkit

# Adopt a newly published idfkit for the source server, as a pull request.
#
# idfkit's notify-downstream.yml dispatches this on every release, in the wave order the consumer
# register (governance/consumers.toml in idfkit-conformance) gives it. It pins the version in
# server/pyproject.toml, relocks, moves the declared level in levels.json, runs the gate, lets Claude
# attempt a minimal repair, and opens a pull request.
#
# THE DECLARED LEVEL IS READ BACK FROM server/uv.lock, NOT TAKEN FROM THE RELEASE. Every bump from
# 1.0.0rc1 to 1.0.0rc4 failed at `make check-levels` and opened no pull request (idfkit/idfkit-lsp#17):
# this workflow wrote the tag's spelling, `1.0.0-rc.4`, into levels.json while uv wrote `1.0.0rc4`
# into the manifest and lockfile. tools/declare_level.py declares whatever the lockfile states, so the
# declaration and the pin cannot disagree about a release they agree on.
#
# Feature 004 of the unification added three steps, each because an adoption could otherwise report
# complete while something it made false stood unexamined:
#
#   Statements. Every `idfkit:unavailable` marker here rests on a parity ledger entry. The markers
#     resting on an entry that moved to complete between the old level's governance tag and the new
#     one are listed in the pull request, which opens as a draft, and this run fails while any is
#     listed (FR-025). Reviewing one is removing the statement, or setting its `own_reason`.
#   The register. When the register holds a lag for this repository's python Resolution, the
#     adoption closes it through a paired pull request in idfkit-conformance (FR-023). Otherwise a
#     level moving needs no register change, because the register points at the files and holds no
#     level.
#   Declining. Run with `decline_reason` to decline a level; nothing is bumped and the register
#     records a deliberate lag with that reason (FR-024).
#
# The model server's second-language half is adopted by bump-idfkit-js.yml, independently: the two
# libraries release on their own cadences and neither adoption waits on the other (FR-021).

on:
  workflow_dispatch:
    inputs:
      idfkit_version:
        description: The published idfkit version to adopt, with or without a leading v.
        required: true
        type: string
      decline_reason:
        description: >
          Leave empty to adopt. To decline this level instead, state why as a policy, never a
          version. Nothing is bumped, and the register records a deliberate lag.
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  CONSUMER: idfkit-lsp
  LIBRARY: python
  GOVERNANCE_LEVEL: governance-2026.18

jobs:
  decline:
    if: inputs.decline_reason != ''
    runs-on: ubuntu-latest
    steps:
      - name: Record the decline in the consumer register
        env:
          GH_TOKEN: ${{ secrets.CONFORMANCE_DISPATCH_TOKEN }}
          REASON: ${{ inputs.decline_reason }}
          RAW_VERSION: ${{ inputs.idfkit_version }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          command=(gh workflow run record-adoption.yml --repo idfkit/idfkit-conformance
                   -f consumer="$CONSUMER" -f library="$LIBRARY" -f outcome=decline -f reason="$REASON")
          printf '## %s declines idfkit %s\n\nReason: %s\n' "$CONSUMER" "$version" "$REASON" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${GH_TOKEN:-}" ]; then
            "${command[@]}"
            echo "Dispatched record-adoption.yml in idfkit-conformance; its pull request records the deliberate lag." >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\nNot recorded: CONFORMANCE_DISPATCH_TOKEN is not set. Run:\n\n```\n%s\n```\n' "$(printf '%q ' "${command[@]}")" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Decline not recorded::A decline the register does not hold is not a decline. Run the command in the step summary."
            exit 1
          fi

  bump:
    if: inputs.decline_reason == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize version
        id: ver
        env:
          RAW_VERSION: ${{ inputs.idfkit_version }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Normalized version: $version"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Read the level this adoption moves from
        id: prev
        run: |
          set -euo pipefail
          previous=$(python3 - <<'PY'
          import pathlib, re, tomllib
          dependencies = tomllib.loads(pathlib.Path("server/pyproject.toml").read_text())["project"]["dependencies"]
          pins = [d.split("==", 1)[1].strip() for d in dependencies if re.match(r"idfkit\s*==", d)]
          if len(pins) != 1:
              raise SystemExit(f"expected one exact idfkit pin in server/pyproject.toml, found {pins}")
          print(pins[0])
          PY
          )
          echo "level=$previous" >> "$GITHUB_OUTPUT"
      - name: Bump idfkit
        working-directory: server
        run: |
          uv add "idfkit==${{ steps.ver.outputs.version }}"
          uv lock
      # A bump that leaves the declaration behind is exactly the silence levels.json removes, so the
      # declared level moves in the same step as the pin, in the spelling the lockfile states.
      - name: Declare the level the lockfile now states
        run: uv run --frozen --extra dev --project server python -m tools.declare_level idfkit server/uv.lock
      - name: Read the register and the ledger at the pinned governance tag
        uses: actions/checkout@v4
        with:
          repository: idfkit/idfkit-conformance
          ref: refs/tags/${{ env.GOVERNANCE_LEVEL }}
          fetch-depth: 0
          path: .governance
          persist-credentials: false
      # Out of this repository's tree: the pull request below commits every change in it.
      - name: Move the governance checkout aside
        run: mv .governance "$RUNNER_TEMP/governance"
      - name: List the statements this adoption surfaces
        id: statements
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.prev.outputs.level }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set +e
          python3 "$RUNNER_TEMP/governance/tools/adoption_statements.py" --library "$LIBRARY" \
            --from "$PREVIOUS" --to "$VERSION" --root . --conformance "$RUNNER_TEMP/governance" \
            > "$RUNNER_TEMP/statements.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/statements.txt"
          if [ "$code" -ge 2 ]; then
            echo "::error title=Statements unknown::The governance levels of idfkit $PREVIOUS and $VERSION could not be read, so the statements this adoption surfaces are unknown. That is not the same as none."
            exit 2
          fi
          if [ "$code" -eq 1 ]; then echo "surfaced=true" >> "$GITHUB_OUTPUT"; else echo "surfaced=false" >> "$GITHUB_OUTPUT"; fi
      - name: Read whether the register holds a lag this adoption closes
        id: lag
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, pathlib, tomllib
          path = pathlib.Path(os.environ["RUNNER_TEMP"], "governance", "governance", "consumers.toml")
          register = tomllib.loads(path.read_text())
          consumer = next(c for c in register["consumer"] if c["id"] == os.environ["CONSUMER"])
          lag = next((r.get("lag") for r in consumer.get("libraries", []) if r["library"] == os.environ["LIBRARY"]), None)
          print(f"closes={'true' if lag else 'false'}")
          print(f"tracked={(lag or {}).get('issue') or (lag or {}).get('reason') or ''}")
          PY
      - name: Install the model server runtime
        working-directory: model-server
        run: |
          npm ci
          npm run build
      # The gate runs ruff, pyright, pytest and the checks' jsonschema, all of which live in the
      # dev extra, so the environment is resolved with it before anything is held to it.
      - name: Install the source server runtime
        working-directory: server
        run: uv sync --extra dev
      - name: Check the declared levels
        run: make check-levels
      - name: Run the gate
        id: tests
        continue-on-error: true
        run: |
          make check 2>&1 | tee "$RUNNER_TEMP/bump-test-output.txt"
      - name: Ask Claude to repair test failures
        if: steps.tests.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            idfkit was bumped to ${{ steps.ver.outputs.version }} (in server/pyproject.toml), and the test suite failed.
            Task:
            - Read the failure output at ${{ runner.temp }}/bump-test-output.txt.
            - Diagnose the compatibility issue caused by the idfkit upgrade.
            - Make the minimal code changes required.
            - If the failure is in tools/check_levels.py, the declared level in levels.json and the pin disagree; fix the declaration rather than the check.
            - Do not refactor unrelated code.
            - Preserve public APIs unless the idfkit upgrade requires a change.
            - Rerun: make check (from the repository root)
            - Leave a concise summary of root cause, changed files, and final test result.
      - name: Rerun the gate after Claude repair
        if: steps.tests.outcome == 'failure'
        run: make check
      - name: Write the pull request body
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PREVIOUS: ${{ steps.prev.outputs.level }}
          TESTS: ${{ steps.tests.outcome }}
          SURFACED: ${{ steps.statements.outputs.surfaced }}
          CLOSES: ${{ steps.lag.outputs.closes }}
          TRACKED: ${{ steps.lag.outputs.tracked }}
          HAS_TOKEN: ${{ secrets.CONFORMANCE_DISPATCH_TOKEN != '' }}
        run: |
          {
            echo "Automated idfkit dependency bump for the source server."
            echo "- Version: \`$VERSION\`, from \`$PREVIOUS\`"
            echo "- Initial gate result: \`$TESTS\`"
            echo "- Gate command: \`make check\` (from the repository root)"
            echo
            echo "If the gate initially failed, Claude attempted a minimal compatibility repair."
            echo
            echo "### Statements of unavailability"
            if [ "$SURFACED" = true ]; then
              echo "**This adoption is not complete.** The new level closes a capability that a statement in this repository says is unavailable. Remove each statement, or set its \`own_reason\` so it stops citing the library, then mark this pull request ready (FR-025):"
              echo
              echo '```'
              cat "$RUNNER_TEMP/statements.txt"
              echo '```'
            else
              echo "None of this repository's statements rests on a capability this level closed."
            fi
            echo
            echo "### Consumer register"
            if [ "$CLOSES" = true ]; then
              echo "The register holds a lag for \`$CONSUMER\` ($LIBRARY), tracked at $TRACKED. This adoption closes it."
              if [ "$HAS_TOKEN" = true ]; then
                echo "A paired pull request in idfkit-conformance removes it; merge the two together (FR-023)."
              else
                echo "Record that in a paired pull request, which needs this run in idfkit-conformance:"
                echo
                echo '```'
                echo "gh workflow run record-adoption.yml --repo idfkit/idfkit-conformance -f consumer=$CONSUMER -f library=$LIBRARY -f outcome=close-lag -f adoption=<this pull request's URL>"
                echo '```'
              fi
            else
              echo "Nothing to record: the register points at the files that declare the level and holds no lag for this repository's $LIBRARY half."
            fi
          } > "$RUNNER_TEMP/pr-body.md"
      - name: Open PR
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/bump-idfkit-${{ steps.ver.outputs.version }}
          title: "Bump idfkit to ${{ steps.ver.outputs.version }}"
          commit-message: "Bump idfkit to ${{ steps.ver.outputs.version }}"
          reviewers: samuelduchesne
          draft: ${{ steps.statements.outputs.surfaced == 'true' }}
          body-path: ${{ runner.temp }}/pr-body.md
      - name: Record the closed lag in the register
        if: steps.lag.outputs.closes == 'true'
        env:
          GH_TOKEN: ${{ secrets.CONFORMANCE_DISPATCH_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning title=Register not updated::CONFORMANCE_DISPATCH_TOKEN is not set. The pull request body carries the command that records the closed lag."
            exit 0
          fi
          gh workflow run record-adoption.yml --repo idfkit/idfkit-conformance \
            -f consumer="$CONSUMER" -f library="$LIBRARY" -f outcome=close-lag -f adoption="$PR_URL"
      - name: Refuse to call the adoption complete while a statement is unreviewed
        if: steps.statements.outputs.surfaced == 'true'
        run: |
          echo "::error title=Statements unreviewed::This adoption surfaced statements of unavailability that the new level made false. The pull request is a draft until each is reviewed."
          exit 1

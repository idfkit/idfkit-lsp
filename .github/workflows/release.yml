# Publish the source server to PyPI when a GitHub release is published.
#
# This is how idfkit-lsp first reaches the package index. Until it existed the server had never been
# published, so the editor plugin's `uvx --from idfkit-lsp` resolved nothing on a clean machine
# (idfkit/idfkit-plugin#17), and the plugin's language-server path could not be pinned to a level
# (feature 004 of the unification, FR-015 and T114).
#
# TRUSTED PUBLISHING, NO TOKEN. PyPI exchanges the OIDC token GitHub mints for this job for
# publish rights, as idfkit-mcp's release does, so there is no long-lived secret to store or
# rotate. PREREQUISITE, ONCE: register a pending trusted publisher on pypi.org for the project
# `idfkit-lsp` with owner `idfkit`, repository `idfkit-lsp` and workflow `release.yml`. Until that
# exists the publish step fails with an authentication error and nothing is uploaded.
#
# THE RELEASE TAG AND THE DECLARED VERSION ARE ONE FACT. The job refuses a release whose tag
# (`v0.2.0`) does not match `server/pyproject.toml`, rather than rewriting the version from the tag,
# so the repository never lies about what it published.
#
# THE MODEL SERVER GOES TO NPM FROM THE SAME RELEASE, as `@idfkit/language-server` (#33), so an
# editor other than VS Code can install it without cloning this repository. Same rules: trusted
# publishing and no token, and the tag must match `model-server/package.json`. npm cannot create a
# package through trusted publishing, so PREREQUISITE, ONCE: publish the first version by hand
# (`npm publish` from `model-server/`, by an owner of the `@idfkit` organization), then add a
# trusted publisher on npmjs.com for `@idfkit/language-server` with organization `idfkit`,
# repository `idfkit-lsp` and workflow `release.yml`. Until that exists the npm publish step fails
# and the PyPI job is unaffected, because the two jobs do not depend on each other.

name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - name: Refuse a release whose tag is not the declared version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          declared=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${TAG#v}" != "$declared" ]; then
            echo "::error title=Tag and version disagree::release $TAG, but server/pyproject.toml declares $declared. Correct one of them; nothing was published."
            exit 1
          fi

      # The wheel only. A source distribution of server/ cannot carry capabilities.json or the
      # licence, both of which live above it; see the comment in server/pyproject.toml.
      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      # A wheel without capabilities.json cannot start: server.py reads it at import time.
      - name: The wheel carries what the server needs to start
        run: |
          python3 - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")
          assert len(wheel) == 1, f"expected one wheel, found {wheel}"
          names = zipfile.ZipFile(wheel[0]).namelist()
          assert any(n.endswith("idfkit_lsp/capabilities.json") for n in names), "capabilities.json is missing"
          assert any(n.endswith("idfkit_lsp/LICENSE") for n in names), "LICENSE is missing"
          print(f"{wheel[0]}: {len(names)} files, capabilities.json and LICENSE present")
          PY

      - name: Publish
        run: uv publish --trusted-publishing always dist/*

  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      # Trusted publishing needs npm 11.5.1 or newer, which Node 24 ships.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Refuse a release whose tag is not the declared version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          declared=$(node -p 'require("./model-server/package.json").version')
          if [ "${TAG#v}" != "$declared" ]; then
            echo "::error title=Tag and version disagree::release $TAG, but model-server/package.json declares $declared. Correct one of them; nothing was published."
            exit 1
          fi

      - run: uv sync --extra dev
        working-directory: server

      - run: npm ci
        working-directory: model-server

      # `npm pack` runs `prepack`, which builds the bundle and copies the licence in.
      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP/pack"
        working-directory: model-server

      - name: Install from the tarball
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/pack/*.tgz

      # The tarball that is checked is the tarball that is published: nothing is rebuilt between.
      - name: The tarball carries what the server needs, and its command starts
        run: >-
          uv run --project server python -m tools.check_package
          --tarball "$(ls "$RUNNER_TEMP"/pack/*.tgz)"
          --installed "$RUNNER_TEMP/consumer"

      - name: Publish
        run: npm publish "$(ls "$RUNNER_TEMP"/pack/*.tgz)" --access public

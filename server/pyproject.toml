[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idfkit-lsp"
version = "0.1.0"
description = "Language Server Protocol implementation for idfkit EnergyPlus library"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "idfkit>=0.4.0",
]

[project.scripts]
idfkit-lint = "idfkit_lsp.cli:main"

[project.optional-dependencies]
server = [
    "pygls>=2.0",
    "lsprotocol",
]
lint = []  # no extra deps beyond idfkit
dev = [
    "pygls>=2.0",
    "lsprotocol",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.9",
    "pyright>=1.1",
    "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/idfkit_lsp"]

# -- Ruff ----------------------------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TC",    # flake8-type-checking
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line length handled by formatter
    "SIM102", # nested ifs can be clearer than combined conditions
    "SIM108", # ternary can reduce readability for multi-line logic
    "TC001",  # moving runtime imports to TYPE_CHECKING breaks code
    "TC002",  # same — third-party imports used at runtime
    "B019",   # lru_cache on methods is intentional (singleton class)
]

[tool.ruff.lint.isort]
known-first-party = ["idfkit_lsp"]

# -- Pyright -------------------------------------------------------------

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
include = ["src"]
exclude = ["**/__pycache__"]

# -- Pytest --------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idfkit-lsp"
version = "0.2.0"
description = "Language Server Protocol implementation for idfkit EnergyPlus library"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pygls==2.1.1",
    "lsprotocol==2025.0.0",
    "idfkit==1.0.0rc1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff==0.16.6",
    "pyright>=1.1",
    "pre-commit>=4.0",
    "jsonschema>=4.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/idfkit_lsp"]

# The declaration is read at import time by server.py, so it has to travel with the package: a
# wheel without it cannot start at all. `_default_path` looks beside the module first, which is
# where this lands, and walks up to the repository root otherwise, which is where a checkout
# reads the one live file from.
[tool.hatch.build.targets.wheel.force-include]
"../capabilities.json" = "idfkit_lsp/capabilities.json"

# -- Ruff ----------------------------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 99
src = ["src", "tests", "../tools", "../tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TC",    # flake8-type-checking
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line length handled by formatter
    "SIM102", # nested ifs can be clearer than combined conditions
    "SIM108", # ternary can reduce readability for multi-line logic
    "TC001",  # moving runtime imports to TYPE_CHECKING breaks code
    "TC002",  # same — third-party imports used at runtime
    "B019",   # lru_cache on methods is intentional (singleton class)
]

[tool.ruff.lint.isort]
known-first-party = ["idfkit_lsp"]

# -- Pyright -------------------------------------------------------------

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
# Pyright runs from server/, so the repository root has to be on the path for the check tools
# and the protocol suite to resolve each other by package name.
extraPaths = [".."]
include = ["src", "../tools", "../tests/protocol"]
exclude = ["**/__pycache__"]

# -- Pytest --------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests", "../tools/tests", "../tests/protocol"]
asyncio_mode = "auto"
